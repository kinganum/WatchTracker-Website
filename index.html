<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicons for all browsers and devices -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" type="image/svg+xml" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- SEO & PWA Meta Tags -->
    <meta name="description" content="WatchTracker - The ultimate app to track your favorite anime, movies, and TV series with AI-powered updates and offline synchronization." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#17181a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WatchTracker" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="144x144" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="120x120" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="114x114" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="76x76" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="72x72" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="60x60" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="57x57" href="/favicon.svg" />
    
    <!-- Android/Chrome Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.svg" />

    <title>WatchTracker</title>
    
    <!-- Preload Styles to prevent FOUC -->
    <style>
      body { visibility: hidden; opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
  <body class="bg-background text-foreground selection:bg-primary selection:text-primary-foreground">
    <div id="root"></div>
    <script>
      // Register Service Worker (only in production or when not on localhost)
      if ('serviceWorker' in navigator) {
        const isProduction = window.location.hostname !== 'localhost' && 
                             window.location.hostname !== '127.0.0.1' &&
                             !window.location.hostname.includes('localhost');
        
        window.addEventListener('load', async () => {
          try {
            // In development, unregister any existing service workers to avoid conflicts
            if (!isProduction) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              for (let registration of registrations) {
                await registration.unregister();
                console.log('ServiceWorker unregistered for development mode');
              }
            } else {
              // In production, register the service worker
              const swUrl = './service-worker.js';
              const registration = await navigator.serviceWorker.register(swUrl);
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            }
          } catch (err) {
            if (isProduction) {
              console.log('ServiceWorker registration failed: ', err);
            }
          }
        });
      }
      
      // Prevent FOUC by showing body after Tailwind loads
      document.addEventListener("DOMContentLoaded", () => {
          document.body.style.visibility = "visible";
          document.body.style.opacity = "1";
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
