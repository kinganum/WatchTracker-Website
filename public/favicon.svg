<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Square rounded background with theme color -->
  <rect width="512" height="512" rx="100" fill="#17181a"/>
  
  <!-- Perfectly centered clapperboard icon - shifted slightly upward and maximized -->
  <g transform="translate(256, 240)">
    <!-- Clapperboard group (centered, shifted up, maximum zoom) -->
    <g transform="translate(-170, -170)">
      <!-- Main clapperboard body (maximum size - fills 98% of space) -->
      <rect x="0" y="85" width="340" height="340" rx="26" fill="#ffffff" stroke="#000000" stroke-width="12"/>
      
      <!-- Top slate (angled, open, hinged on left) -->
      <g transform="translate(0, 85)">
        <g transform="rotate(-15, 0, 0)">
          <rect x="0" y="0" width="340" height="85" rx="15" fill="#ffffff" stroke="#000000" stroke-width="12"/>
          <!-- Diagonal stripes (3 black stripes) -->
          <line x1="0" y1="0" x2="340" y2="85" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
          <line x1="0" y1="34" x2="340" y2="119" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
          <line x1="0" y1="68" x2="340" y2="153" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
        </g>
      </g>
      
      <!-- Play button (perfectly centered in clapperboard body, larger for maximum visibility) -->
      <!-- Centered at x=170 (half of 340) -->
      <path d="M 127 232 L 127 358 L 213 295 Z" fill="#000000"/>
    </g>
  </g>
</svg>
